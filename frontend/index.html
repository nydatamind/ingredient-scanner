<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Camera & Gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   'Plus Jakarta Sans', sans-serif;
      padding: 4px 0 6px;
    }

    /* ── True hidden file inputs ── */
    #cam-input,
    #gal-input {
      position: absolute;
      left: -9999px;
      top: -9999px;
      opacity: 0;
      width: 0;
      height: 0;
    }

    /* ── Button row ── */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* ── Base label-button ── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 12px;
      height: 52px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .btn:active {
      transform: scale(0.96);
    }

    /* ── Camera – gradient ── */
    .btn-cam {
      background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      color: #ffffff;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 20px rgba(37,99,235,0.45);
    }

    .btn-cam:active {
      box-shadow: 0 2px 10px rgba(37,99,235,0.3);
      filter: brightness(1.1);
    }

    /* ── Gallery – dark glass ── */
    .btn-gal {
      background: rgba(23,29,43,0.97);
      color: #cbd5e1;
      border: 1px solid #2a3449;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }

    .btn-gal:active {
      background: #1e2638;
      color: #ffffff;
      border-color: #3b82f6;
    }

    /* ── Status bar ── */
    #status {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      padding: 6px 10px;
      border-radius: 8px;
      display: none;
    }

    #status.loading {
      display: block;
      background: rgba(59,130,246,0.12);
      border: 1px solid rgba(59,130,246,0.3);
      color: #93c5fd;
    }

    #status.success {
      display: block;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.3);
      color: #6ee7b7;
    }
  </style>
</head>
<body>

  <!--
    CAMERA INPUT: accept="image/*" capture="environment"
      → Android / iOS opens the original native Camera app directly.
      → User takes photo, taps tick mark ✔ / OK → photo returned to app.
    GALLERY INPUT: accept="image/*"  (no capture attribute)
      → Android / iOS opens the Photo Gallery / Media Picker directly.
      → Does NOT open the generic file manager for documents.
  -->
  <input type="file" id="cam-input" accept="image/*" capture="environment">
  <input type="file" id="gal-input" accept="image/*">

  <div class="btn-row">
    <label for="cam-input" class="btn btn-cam">
      📷 Camera
    </label>
    <label for="gal-input" class="btn btn-gal">
      🖼️ Gallery
    </label>
  </div>

  <div id="status"></div>

  <script>
    // ─────────────────────────────────────────────────────────────────────
    // Streamlit Component Protocol (bidirectional communication)
    // ─────────────────────────────────────────────────────────────────────

    var STREAMLIT_ORIGIN = window.location.origin;

    function stPost(msg) {
      window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), "*");
    }

    // 1. Announce we are ready (critical – without this Streamlit renders blank)
    function componentReady() {
      stPost({ type: "streamlit:componentReady", apiVersion: 1 });
      setFrameHeight();
    }

    // 2. Set iframe height so Streamlit sizes the container correctly
    function setFrameHeight() {
      var h = document.documentElement.scrollHeight || document.body.scrollHeight || 70;
      stPost({ type: "streamlit:setFrameHeight", height: h });
    }

    // 3. Send image data back to Python
    function sendValue(val) {
      stPost({ type: "streamlit:setComponentValue", value: val });
    }

    // ─────────────────────────────────────────────────────────────────────
    // Status helper
    // ─────────────────────────────────────────────────────────────────────
    var statusEl = document.getElementById("status");

    function showStatus(text, cls) {
      statusEl.className = cls;
      statusEl.textContent = text;
      setFrameHeight();
    }

    function hideStatus() {
      statusEl.className = "";
      statusEl.textContent = "";
      setFrameHeight();
    }

    // ─────────────────────────────────────────────────────────────────────
    // File handler: resize → base64 → send to Python
    // ─────────────────────────────────────────────────────────────────────
    function handleFile(file, source) {
      if (!file) return;

      showStatus("⏳ Loading image…", "loading");

      var reader = new FileReader();

      reader.onload = function (e) {
        var img = new Image();

        img.onload = function () {
          var MAX = 1600;
          var w = img.width, h = img.height;

          if (w > MAX || h > MAX) {
            if (w >= h) { h = Math.round(h * MAX / w); w = MAX; }
            else         { w = Math.round(w * MAX / h); h = MAX; }
          }

          var canvas = document.createElement("canvas");
          canvas.width  = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);

          var b64 = canvas.toDataURL("image/jpeg", 0.88);

          showStatus(
            source === "camera" ? "✓ Photo captured!" : "✓ Image loaded!",
            "success"
          );

          sendValue({
            data:      b64,
            source:    source,
            name:      file.name || (source === "camera" ? "camera.jpg" : "gallery.jpg"),
            width:     w,
            height:    h,
            timestamp: Date.now()
          });

          setTimeout(hideStatus, 2500);
        };

        img.onerror = function () {
          showStatus("⚠️ Could not read image. Try again.", "loading");
          setTimeout(hideStatus, 3000);
        };

        img.src = e.target.result;
      };

      reader.onerror = function () {
        showStatus("⚠️ File read error. Try again.", "loading");
        setTimeout(hideStatus, 3000);
      };

      reader.readAsDataURL(file);
    }

    // ─────────────────────────────────────────────────────────────────────
    // Wire up file inputs
    // ─────────────────────────────────────────────────────────────────────
    document.getElementById("cam-input").addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) {
        handleFile(e.target.files[0], "camera");
      }
      e.target.value = "";   // reset so same file can be re-captured
    });

    document.getElementById("gal-input").addEventListener("change", function (e) {
      if (e.target.files && e.target.files[0]) {
        handleFile(e.target.files[0], "gallery");
      }
      e.target.value = "";   // reset so same image can be re-selected
    });

    // ─────────────────────────────────────────────────────────────────────
    // Listen for render event from Streamlit (re-sent on every rerun)
    // ─────────────────────────────────────────────────────────────────────
    window.addEventListener("message", function (event) {
      if (event.data && event.data.type === "streamlit:render") {
        setFrameHeight();
      }
    });

    // ─────────────────────────────────────────────────────────────────────
    // Initialise: announce ready as early as possible
    // ─────────────────────────────────────────────────────────────────────
    // Try immediately, and again after DOM paint to be safe
    componentReady();
    window.addEventListener("load", function () {
      componentReady();
      setTimeout(setFrameHeight, 100);
    });
  </script>
</body>
</html>
